# Netlify — OLD Vite SPA only (tripime-v2/frontend → dist).
# This is NOT the new Next.js UI (see "New next js tripime/frontend").
# If tripimee.netlify.app still shows the old design, reconnect the site
# to the Next.js repo and use frontend/netlify.toml there instead.
#
# Site settings: Base directory = frontend (also set below).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback for React Router (/admin, /booking/*, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
